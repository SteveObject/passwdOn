<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>passwdOn · 密码库</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="manager.js"></script>
</head>
<body class="manager">
  <header class="bar">
    <div class="brand"><img src="icons/48.png" alt="" width="34" height="34"> passwdOn</div>
    <button type="button" class="quiet" id="lock" hidden>锁定密码库</button>
  </header>
  <main>
    <section id="gate" hidden></section>
    <section id="library" hidden>
      <div class="intro">
        <div>
          <h1>密码库</h1>
          <p class="muted">按站点保存账号，按分组整理。</p>
        </div>
        <button type="button" class="primary" id="new-account">新增账号</button>
      </div>
      <div class="layout">
        <aside class="groups" aria-label="分组">
          <div class="group-header"><h2>分组</h2><button type="button" class="quiet" id="new-group">新建</button></div>
          <div id="groups"></div>
        </aside>
        <section class="accounts" aria-labelledby="group-title">
          <div class="account-header">
            <h2 id="group-title"></h2>
            <button type="button" class="quiet" id="edit-group" hidden>编辑分组</button>
          </div>
          <label class="sr-only" for="search">搜索账号</label>
          <input id="search" type="search" placeholder="搜索站点、名称或账号">
          <div id="accounts"></div>
        </section>
      </div>
    </section>
    <p id="app-error" class="error" role="alert" hidden></p>
  </main>

  <dialog id="editor" aria-labelledby="editor-title">
    <form id="edit-form" autocomplete="off">
      <h2 id="editor-title"></h2>
      <div id="edit-fields" class="fields"></div>
      <p id="edit-error" class="error" role="alert" hidden></p>
      <div class="dialog-actions">
        <button type="button" class="danger" id="remove" hidden>删除</button>
        <button type="button" class="quiet" id="cancel">取消</button>
        <button type="submit" class="primary" id="save">保存</button>
      </div>
    </form>
  </dialog>
</body>
</html>
